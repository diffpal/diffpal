name: Bug report
description: Report a reproducible DiffPal defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security issues, use private vulnerability reporting instead.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the complete error message?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe configuration and command that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DiffPal version
      placeholder: Output of diffpal version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, CI host, provider, and integration.
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Sensitive data
      options:
        - label: I removed credentials, private source, and personal data from this report.
          required: true
