name: diffpal-dev

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: diffpal-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Codex sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build DiffPal
        run: go build -o .artifacts/bin/diffpal ./cmd/diffpal

      - name: Install Codex provider
        run: npm install --global @openai/codex@0.139.0 @normahq/codex-acp-bridge@1.8.4

      - name: Authenticate Codex
        run: |
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
          {
            echo 'sandbox_mode = "workspace-write"'
            echo 'approval_policy = "untrusted"'
          } > "$HOME/.codex/config.toml"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run DiffPal review
        run: >-
          .artifacts/bin/diffpal --profile ci review github
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --repo ${{ github.repository }}
          --review-id github-pr-${{ github.event.pull_request.number }}-diffpal-dev
          --review-channel diffpal-dev
          --feedback summary
          --gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
