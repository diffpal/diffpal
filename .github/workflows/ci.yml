name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go tool golangci-lint run ./...

      - name: Validate GitHub Actions
        run: go tool actionlint

      - name: Validate CLI surface
        run: go run ./cmd/diffpal --help

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run prompt and eval fixture tests
        run: go test ./internal/reviewer ./internal/reviewer/promptpack -run 'Test(RenderReview|ReviewTask|ReviewEval|RunWithRuntimeLabelsPromptInjectionDiffAsUntrusted|RenderReviewTaskInputEscapesCommitAndPathInjectionFixtures|RunWithRuntimeDoesNotPreloadInjectionFixtureContent)'

      - name: Run tests with coverage
        shell: bash
        run: |
          mkdir -p .artifacts
          go test ./... -coverprofile=.artifacts/coverage.out
          coverage="$(go tool cover -func=.artifacts/coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "total coverage: ${coverage}%"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 75) exit 1 }'

      - name: Run race tests
        run: go test -race ./...

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Run govulncheck
        run: go tool govulncheck ./...
