version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - errcheck
    - gocognit
    - govet
    - ineffassign
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    gocognit:
      min-complexity: 70
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: var-naming
        - name: unused-parameter
        - name: indent-error-flow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocognit
